[server]
listen = "127.0.0.1:3000"
public_url = "http://127.0.0.1:3000"
# Optional separate admin listener and user API origin (set both).
# public_url always refers to the ADMIN origin; it must use a different hostname.
# admin_listen = "127.0.0.1:3001"
# public_url = "http://localhost:3001" # replace public_url above
# proxy_public_url = "http://127.0.0.1:3000"
# Use "production" to enable stricter startup validation for secure deployments.
deployment = "development"
# Serve the embedded SvelteKit admin dashboard under /ui (build with
# `pnpm --dir crates/llmtrace/ui build`). Set false to disable the UI entirely.
ui_enabled = true

[proxy]
# "litellm" enables versioned/unversioned inference and supporting API routes.
# See llmtrace.litellm.example.toml and docs/litellm.md for a split-domain setup.
preset = "custom"
default_upstream = "https://api.openai.com"
# Required in production mode to avoid running as an open proxy.
# Supported entries include "api.openai.com", "api.openai.com:443",
# "https://api.openai.com", and "https://api.example.com/v1".
allow_upstreams = []
# Only incoming paths matching one of these prefixes are proxied to upstream.
# Other paths (for example /favicon.ico or /.well-known/*) return 404 locally.
# Unset: custom preset uses ["/v1"]; litellm uses its built-in route list.
# An explicit list replaces the preset's forwarding routes. ["/"] allows all.
# path_prefixes = ["/v1"]
# Unset: custom captures all forwarded routes; litellm captures inference only.
# Explicit prefixes capture all methods on matching forwarded routes; [] disables.
# capture_path_prefixes = ["/v1/chat/completions", "/v1/responses"]
upstream_header = "x-llmtrace-upstream"
timeout_secs = 300
# Live proxy traffic limits. Oversized HTTP request bodies are rejected with 413.
# Response capture is preserved for auditing until max_response_body_bytes.
max_request_body_bytes = 67108864
max_response_body_bytes = 67108864
max_websocket_message_bytes = 16777216
max_websocket_session_bytes = 536870912

[archive]
# Payload segments are written to the filesystem first. Use "postgres" only
# when filesystem storage is unavailable. S3 storage is intentionally not
# implemented yet.
storage_backend = "filesystem"
filesystem_root = "spool/archive"
# Request/response bodies share one immutable segment when their combined
# framed size fits this target; larger pairs use separate segments.
segment_uncompressed_bytes = 33554432
# Fast zstd compression; level 1 favors throughput for stream audit capture.
compression_level = 1

[storage]
postgres_url = "postgres://postgres:postgres@localhost:5432/llmtrace"
max_connections = 10
acquire_timeout_secs = 30
trace_queue_capacity = 4096
# Aggregate allocation budget for captured events waiting or being processed.
# Worker scratch buffers and live proxy captures need additional memory.
# Excess events are dropped without delaying traffic; monitor /metrics.
# Environment override: LLMTRACE_TRACE_QUEUE_MAX_BYTES.
trace_queue_max_bytes = 268435456
trace_worker_count = 4
# Production mode requires retention_days. Leave unset in development if you
# do not want automatic trace/audit pruning.
# retention_days = 30
retention_prune_interval_secs = 3600
retention_prune_batch_size = 1000
# Size rotation removes oldest requests and their payloads when total compressed
# archive bytes exceed this limit. 0 disables size rotation. For 10 GiB, use
# 10737418240. Excludes database metadata/indexes/WAL and operational stdout logs.
# Environment overrides: LLMTRACE_ROTATE_SIZE_BYTES,
# LLMTRACE_ROTATE_CHECK_INTERVAL_SECS. Changes take effect on restart.
rotate_size_bytes = 0
rotate_check_interval_secs = 60

# Persistent intake journal, separate from archive rotation. One stable directory
# per instance. Files contain raw bodies AND unredacted plugin credentials.
# Full journals reject new captures; pending captures are never size-rotated.
# All fields have LLMTRACE_JOURNAL_* environment overrides (see README).
[storage.journal]
enabled = true
directory = "spool/journal"
max_bytes = 1073741824
max_records = 100000
retry_interval_secs = 2

[observability]
# Optional outside production. Production mode requires this so GET /metrics
# requires Authorization: Bearer <token>.
# metrics_bearer_token = ""

[auth]
# Required in production mode when server.public_url uses https. Set false only
# for HTTP-only endpoints where non-Secure browser cookies are acceptable.
cookie_secure = false
session_ttl_hours = 24

[auth.login_rate_limit]
# Production mode requires this to stay enabled. Limits are tracked in memory
# per username and source IP, so keep an edge/WAF rate limit for multi-instance
# or internet-facing deployments.
enabled = true
max_failures = 5
window_secs = 300
lockout_secs = 900
max_tracked_entries = 4096

[auth.local_admin]
username = "admin"
# For development only. Prefer password_hash in production.
password = "admin"
# password_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."

[auth.oauth]
enabled = false
# issuer_url may be HTTP for providers reached through an internal reverse proxy.
# redirect_url may be HTTP or HTTPS; set it to the callback URL visible to the
# browser and OAuth provider, which may be a reverse-proxy endpoint.
issuer_url = ""
client_id = ""
client_secret = ""
redirect_url = ""
timeout_secs = 15
# Production mode requires this to stay true before email/domain allowlists are applied.
require_email_verified = true
# Exact email addresses only, for example ["admin@example.com"].
allowed_emails = []
# Domain names only, for example ["example.com"]. Do not use URL syntax or wildcards.
allowed_domains = []

[redaction]
sensitive_headers = [
  "authorization",
  "proxy-authorization",
  "api-key",
  "x-api-key",
  "openai-api-key",
  "anthropic-api-key",
  "x-goog-api-key",
  "cookie",
  "set-cookie"
]
store_header_hash = true
# Request and response bodies are stored unredacted in archive segments.
# Header credentials and upstream/URI query values are still redacted.

# [[plugins]]
# Up to 64 plugins. Names must be printable ASCII and at most 128 bytes.
# name = "api-key-user-mapper"
# wasm_path = "./plugins/api_key_user_mapper.wasm"
# hooks = ["on_request_start", "on_response_headers", "on_response_end"]
# timeout_ms = 50

# Optional deployment-specific text token rates in USD per million tokens.
# Exact model name returned by the upstream; these are illustrative, not provider prices.
# Missing usage, model prices, or necessary cache rates leave estimated cost unknown.
# [pricing."your-model-name"]
# input = 2.0
# output = 8.0
# cache_read = 0.5
# cache_write = 2.5

# Identity lookup plugins can import llmtrace.http_get (see docs/plugin-http.md).
# This is an example configuration; provide your own WASM module and real lookup URL.
# [[plugins]]
# name = "user-identity"
# wasm_path = "plugins/user-identity.wasm"
# hooks = ["on_request_start"]
# timeout_ms = 1000
# http_get_urls = ["https://llm.example.com/v1/whoami"]
