[server]
listen = "127.0.0.1:3000"
public_url = "http://127.0.0.1:3000"
# Use "production" to enable stricter startup validation for secure deployments.
deployment = "development"
ui_enabled = true

[proxy]
default_upstream = "https://api.openai.com"
# Required in production mode to avoid running as an open proxy.
# Supported entries include "api.openai.com", "api.openai.com:443",
# "https://api.openai.com", and "https://api.example.com/v1".
allow_upstreams = []
upstream_header = "x-llmtrace-upstream"
timeout_secs = 300
max_body_capture_bytes = 1048576

[storage]
postgres_url = "postgres://postgres:postgres@localhost:5432/llmtrace"
max_connections = 10
trace_queue_capacity = 4096
trace_worker_count = 4

[auth]
# Required in production mode so browser session cookies are sent only over HTTPS.
cookie_secure = false
session_ttl_hours = 24

[auth.login_rate_limit]
# Production mode requires this to stay enabled. Limits are tracked in memory
# per username and source IP, so keep an edge/WAF rate limit for multi-instance
# or internet-facing deployments.
enabled = true
max_failures = 5
window_secs = 300
lockout_secs = 900
max_tracked_entries = 4096

[auth.local_admin]
username = "admin"
# For development only. Prefer password_hash in production.
password = "admin"
# password_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."

[auth.oauth]
enabled = false
issuer_url = ""
client_id = ""
client_secret = ""
redirect_url = ""
allowed_emails = []
allowed_domains = []

[redaction]
sensitive_headers = [
  "authorization",
  "proxy-authorization",
  "api-key",
  "x-api-key",
  "openai-api-key",
  "anthropic-api-key",
  "x-goog-api-key"
]
store_header_hash = true
# Body storage mode: "disabled" (store as-is), "drop" (store nothing),
# or "json_secrets" (mask secret-looking JSON string values). Production
# mode requires "drop" or "json_secrets".
body_redaction = "disabled"

