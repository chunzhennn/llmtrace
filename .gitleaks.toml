title = "llmtrace secret scanning"

[extend]
useDefault = true

# These exact README examples were reviewed across the full Git history.
# Keep exclusions limited to the matching rule, path, and placeholder value.
[[allowlists]]
description = "README provider-key placeholders"
targetRules = ["curl-auth-header"]
condition = "AND"
paths = ['''^README\.md$''']
regexTarget = "secret"
regexes = ['''^sk-(ant-)?example$''']

[[allowlists]]
description = "README example conversation identifier is not an API key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^README\.md$''']
regexTarget = "secret"
regexes = ['''^conversation-456$''']

[[allowlists]]
description = "litellm-user plugin test fixture token placeholder"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^crates/litellm-user-plugin/src/lib\.rs$''']
regexTarget = "secret"
regexes = ['''^5f2b29b5c8f1f7e4a9d0c3b6e8f1a4d7c2e5b8a1f4d7c0e3b6a9d2c5e8f1b4a7$''']
