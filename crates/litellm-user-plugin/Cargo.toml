[package]
name = "litellm-user-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# cdylib produces the .wasm module loaded by llmtrace; rlib keeps unit tests
# runnable on the host architecture without the http_get host import.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true
